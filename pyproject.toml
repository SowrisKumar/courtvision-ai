[project]
name = "courtvision"
version = "0.1.0"
description = "CourtVision AI — NBA analytics & decision intelligence platform"
requires-python = ">=3.11"
dependencies = [
    "nba_api>=1.11",
    "pandas>=2.2",
    "duckdb>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "scikit-learn>=1.5",
    "joblib>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "matplotlib>=3.9",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
