# Full stack: `docker compose up --build` then open http://localhost:8080
#
# The api service reads the warehouse from ./data (ingest locally first with
# `python scripts/ingest.py`), or set COURTVISION_DEMO=1 for synthetic data.
# LLM keys are passed through from your shell for the AI features.

services:
  api:
    build: .
    volumes:
      - ./data:/app/data
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      COURTVISION_LLM: ${COURTVISION_LLM:-}
      COURTVISION_LLM_MODEL: ${COURTVISION_LLM_MODEL:-}
      COURTVISION_DEMO: ${COURTVISION_DEMO:-}
    ports:
      - "8000:8000"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80"
